<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What are you doing?</title>
<style>
:root{--bg:#e6f3f1;--panel:#fff;--ink:#23323a;--teal:#12a0bd;--org:#f0881f;--ok:#2e9d57;--bad:#d64545;--soft:#f4f9f8;--line:#cfe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13242a;--panel:#1d333b;--ink:#eef6f6;--soft:#17292f;--line:#33505a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.4}
main{max-width:1060px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:clamp(34px,7vw,64px);margin:0 0 4px;color:var(--teal);text-align:center;letter-spacing:-.5px}
.sub{text-align:center;margin:0 0 14px;opacity:.75;font-size:15px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer}
.tab[aria-current=true]{border-color:var(--org);background:var(--org);color:#fff}
.tab.done::after{content:" ✓"}
.stage{display:grid;grid-template-columns:1.35fr 1.35fr .8fr;gap:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.card h2{margin:0;font-size:15px;opacity:.7;font-weight:400;align-self:flex-start}
.pic{max-width:100%;max-height:320px;border-radius:12px;object-fit:contain}
.bub{position:relative;background:var(--soft);border:3px solid var(--org);border-radius:22px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:96px;align-items:center;width:100%;padding:16px 12px}
.bub::after{content:"";position:absolute;bottom:-14px;left:28px;width:22px;height:22px;background:var(--soft);border-right:3px solid var(--org);border-bottom:3px solid var(--org);transform:rotate(45deg) skew(10deg,10deg)}
.bub.r::after{left:auto;right:28px}
.slot{min-width:128px;min-height:58px;border:2px dashed var(--teal);border-radius:12px;background:var(--panel);color:var(--teal);font:inherit;font-size:24px;padding:4px 14px;cursor:pointer}
.slot.hov{outline:3px solid var(--org);outline-offset:2px;background:var(--soft)}
.slot.full{border-style:solid;font-weight:700}
.slot.bad{border-color:var(--bad);color:var(--bad);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.words{display:flex;flex-wrap:wrap;gap:7px;width:100%;justify-content:center;touch-action:none}
.word{border:2px solid var(--teal);background:var(--panel);color:var(--teal);border-radius:10px;padding:6px 9px;font:inherit;font-size:15px;cursor:grab;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}.ghost{position:fixed;z-index:99;pointer-events:none;background:var(--teal);color:#fff;box-shadow:0 6px 14px #0004;transform:translate(-50%,-50%) scale(1.15)}

.word.used{visibility:hidden}
.msg{min-height:24px;text-align:center;font-size:16px;margin:12px 0 4px}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.log{margin-top:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px}
.log h2{margin:0 0 8px;font-size:20px}
.set{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;border-top:1px dashed var(--line)}
.set img{height:84px;border-radius:10px}
.sp{border:2px solid var(--org);background:var(--soft);color:var(--ink);border-radius:18px;padding:8px 16px;font-size:21px}
.sp b{color:var(--teal);font-weight:400}
.empty{opacity:.6;margin:0}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:10px}
.btn{border:0;border-radius:12px;padding:9px 18px;font:inherit;font-size:16px;cursor:pointer;background:var(--org);color:#fff}
.btn.g{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.btn[hidden]{display:none}
button:focus-visible{outline:3px solid var(--org);outline-offset:2px}
@media(max-width:820px){.stage{grid-template-columns:1fr 1fr}.stage .card:last-child{grid-column:1/-1}}
@media(max-width:520px){.stage{grid-template-columns:1fr}.pic{max-height:220px}.set img{height:64px}}
</style></head>

];
const SHUF=[3,0,4,1,2];
let order=SHUF.map(i=>S[i]),cur=0,slots,done={},locked=false,deck=[];
const $=id=>document.getElementById(id);
const GP=document.querySelector('.card img').src;
const ALL=['What are','you doing?',"I'm"].concat(S.map(s=>s.t));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){
  slots={q1:null,q2:null,a1:null,a2:null};locked=false;deck=shuffle(ALL);
  const st=order[cur];$('ch').src=st.img;$('ch').alt=st.n;
  $('msg').textContent='';$('msg').className='msg';$('nxt').hidden=true;
  render();
}
function render(){
  $('tabs').innerHTML='';
  order.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(done[s.k]?' done':'');b.textContent='그림 '+(i+1);
    if(i===cur)b.setAttribute('aria-current','true');b.onclick=()=>{cur=i;init()};$('tabs').appendChild(b)});
  const mk=id=>`<button class="slot${slots[id]?' full':''}" data-s="${id}" aria-label="빈칸">${slots[id]||'&nbsp;'}</button>`;
  $('qb').innerHTML=mk('q1')+mk('q2');$('ab').innerHTML=mk('a1')+mk('a2');
  const used=Object.values(slots);
  $('w1').innerHTML=deck.map(t=>`<button class="word${used.includes(t)?' used':''}" data-t="${t}">${t}</button>`).join('');
  document.querySelectorAll('.slot').forEach(e=>e.onclick=()=>{const id=e.dataset.s;if(!locked&&slots[id]){slots[id]=null;render()}});
  document.querySelectorAll('.word').forEach(e=>e.onpointerdown=ev=>drag(ev,e));
}
function drag(ev,el){
  if(locked||ev.button>0)return;ev.preventDefault();
  const g=el.cloneNode(true);g.className='word ghost';document.body.appendChild(g);
  let hov=null;
  const mv=e=>{g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
    const s=document.elementFromPoint(e.clientX,e.clientY),sl=s&&s.closest('.slot');
    if(hov&&hov!==sl)hov.classList.remove('hov');if(sl)sl.classList.add('hov');hov=sl};
  const up=e=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    g.remove();if(hov)hov.classList.remove('hov');
    const s=document.elementFromPoint(e.clientX,e.clientY),sl=s&&s.closest('.slot');
    if(sl&&e.type==='pointerup')put(sl.dataset.s,el.dataset.t)};
  mv(ev);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function put(id,t){slots[id]=t;render();if(Object.values(slots).every(Boolean))check()}
function check(){
  const st=order[cur],exp={q1:'What are',q2:'you doing?',a1:"I'm",a2:st.t};
  const bad=Object.keys(exp).filter(k=>slots[k]!==exp[k]);
  if(!bad.length){win();return}
  locked=true;
  bad.forEach(k=>document.querySelector(`[data-s=${k}]`).classList.add('bad'));
  $('msg').className='msg no';$('msg').textContent='앗, 순서나 그림이 달라요. 빨간 칸을 다시 채워 보세요!';
  setTimeout(()=>{bad.forEach(k=>slots[k]=null);locked=false;$('msg').textContent='';render()},1300);
}
function win(){
  locked=true;const st=order[cur];done[st.k]=1;
  $('msg').className='msg ok';$('msg').textContent='잘했어요! 대화가 완성됐어요 🎉';
  const l=$('log');if(l.querySelector('.empty'))l.innerHTML='';
  const old=l.querySelector('[data-k="'+st.k+'"]');if(old)old.remove();
  const q=slots.q1+' '+slots.q2,a=slots.a1+' '+slots.a2+'.';
  const d=document.createElement('div');d.className='set';d.dataset.k=st.k;
  d.innerHTML=`<img src="${GP}" alt="할아버지"><span class="sp">${q}</span><img src="${st.img}" alt="${st.n}"><span class="sp">${a}</span><button class="btn g" aria-label="듣기">🔊</button>`;
  d.querySelector('button').onclick=()=>say(q+' '+a);
  l.appendChild(d);say(q+' '+a);render();
  const left=order.findIndex(s=>!done[s.k]);
  $('nxt').hidden=false;$('nxt').textContent=left<0?'처음부터 다시':'다음 그림';
}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
$('nxt').onclick=()=>{const left=order.findIndex(s=>!done[s.k]);if(left<0){done={};$('log').innerHTML='<p class="empty">대화를 완성하면 여기에 모여요.</p>';cur=0}else cur=left;init()};
$('clr').onclick=init;
init();
</script></body></html>
